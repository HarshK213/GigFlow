version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: gigflow-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: gigflow

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: gigflow-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/gigflow
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-secure-random-string}
      JWT_EXPIRES_IN: 7d

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: gigflow-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
